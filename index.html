<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar CRM — Agiliza Credi</title>
<style>
:root{
  --navy:#16305c; --navy-dark:#0e2144; --navy-light:#1e4585;
  --orange:#f7941d; --orange-dark:#dd7e08;
  --bg:#eef2f7; --card:#ffffff; --border:#e1e7ef;
  --text:#1f2937; --muted:#6b7280;
  --green:#16a34a; --green-bg:#eafaf0;
  --red:#dc2626; --red-bg:#fdecec;
  --yellow:#b45309; --yellow-bg:#fef3e0;
  --blue:#2563eb; --blue-bg:#eaf1ff;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
button{cursor:pointer;font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--border);border-radius:7px;width:100%;background:#fff;color:var(--text);}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy-light);outline-offset:0;}
label{font-size:11.5px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.3px;display:block;margin-bottom:5px;}
.field{margin-bottom:14px;}
.grid{display:grid;gap:14px;}
.grid.c2{grid-template-columns:1fr 1fr;}
.grid.c3{grid-template-columns:1fr 1fr 1fr;}
.grid.c4{grid-template-columns:1fr 1fr 1fr 1fr;}
@media(max-width:800px){.grid.c2,.grid.c3,.grid.c4{grid-template-columns:1fr;}}

/* LOGIN */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy-dark),var(--navy-light));}
.loginBox{background:#fff;padding:40px 36px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:340px;}
.loginBox h1{color:var(--navy);font-size:22px;margin:0 0 2px;}
.loginBox .sub{color:var(--muted);font-size:13px;margin-bottom:22px;}
.loginBox .barTop{height:5px;width:52px;background:var(--orange);border-radius:3px;margin-bottom:14px;}
.btn{display:inline-block;border:none;border-radius:8px;padding:10px 16px;font-size:13.5px;font-weight:600;transition:.15s;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-light);}
.btn-orange{background:var(--orange);color:#fff;}
.btn-orange:hover{background:var(--orange-dark);}
.btn-outline{background:#fff;color:var(--navy);border:1.5px solid var(--navy);}
.btn-outline:hover{background:#eef3fb;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid #f5c6c6;}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:6px;}
.btn-block{width:100%;}
.err{color:var(--red);font-size:12.5px;margin-top:8px;min-height:14px;}

/* APP SHELL */
#app{display:none;min-height:100vh;}
header.top{background:var(--navy-dark);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;}
header.top .brand{display:flex;align-items:center;gap:14px;font-weight:800;letter-spacing:.5px;font-size:17px;}
header.top .brand img{height:40px;background:#fff;padding:5px 10px;border-radius:8px;}
header.top .brand .welcome{display:flex;flex-direction:column;line-height:1.25;}
header.top .brand .welcome b{font-size:15px;color:#fff;}
header.top .brand .welcome span{font-size:11px;color:var(--orange);font-weight:700;letter-spacing:.5px;text-transform:uppercase;}
header.top .brand .bar{width:5px;height:22px;background:var(--orange);border-radius:2px;}
header.top .userinfo{display:flex;align-items:center;gap:14px;font-size:13.5px;}
header.top .userinfo b{color:#fff;}
nav.tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:4px;overflow-x:auto;}
nav.tabs button{background:transparent;border:none;padding:14px 16px;font-size:13.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;}
nav.tabs button.active{color:var(--navy);border-bottom-color:var(--orange);}
main{padding:22px 26px 60px;max-width:1300px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:18px;}
.card h3{margin:0 0 16px;color:var(--navy);font-size:15px;display:flex;align-items:center;gap:8px;}
.card h3::before{content:'';width:4px;height:16px;background:var(--orange);border-radius:2px;}
.pageHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.pageHead h2{margin:0;color:var(--navy);font-size:19px;}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.toolbar input,.toolbar select{width:auto;min-width:200px;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:left;color:var(--navy);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;padding:10px 8px;border-bottom:2px solid var(--border);}
tbody td{padding:11px 8px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:#f8fafc;}
.tableWrap{overflow-x:auto;}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;}
.pill.pendente{background:var(--yellow-bg);color:var(--yellow);}
.pill.integrada{background:var(--green-bg);color:var(--green);}
.pill.recusada,.pill.cancelada{background:var(--red-bg);color:var(--red);}
.pill.analise,.pill.digitacao,.pill.desbloqueio,.pill.saldo{background:var(--blue-bg);color:var(--blue);}
.pill.paga{background:var(--green-bg);color:var(--green);}
.iconbtn{border:1px solid var(--border);background:#fff;border-radius:6px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;margin-right:4px;}
.iconbtn:hover{background:#f1f5f9;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;}
.kpi .lbl{font-size:11.5px;text-transform:uppercase;color:var(--muted);letter-spacing:.3px;font-weight:700;}
.kpi .val{font-size:22px;font-weight:800;color:var(--navy);margin-top:6px;}
.kpi.orange .val{color:var(--orange-dark);}
.kpi.green .val{color:var(--green);}
.kpi.red .val{color:var(--red);}
.muted{color:var(--muted);}
.empty{padding:30px;text-align:center;color:var(--muted);font-size:13.5px;}
.badge-role{background:rgba(255,255,255,.15);padding:3px 9px;border-radius:12px;font-size:11px;}

/* MODAL */
#overlay{display:none;position:fixed;inset:0;background:rgba(15,25,45,.55);z-index:50;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;}
#modal{background:#fff;border-radius:14px;padding:26px 26px 22px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
#modal h3{margin:0 0 18px;color:var(--navy);}
.modalActions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;}
.closeX{float:right;background:none;border:none;font-size:20px;color:var(--muted);}
textarea{resize:vertical;min-height:70px;}

/* TABS pill (simulador convenio) */
.simTabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.simTabs button{padding:9px 14px;border-radius:8px;border:1.5px solid var(--border);background:#fff;font-size:12.5px;font-weight:700;color:var(--muted);}
.simTabs button.active{border-color:var(--orange);color:var(--orange-dark);background:#fff8ef;}
#msgPronta{white-space:pre-wrap;font-family:'Consolas',monospace;font-size:12.5px;background:#f8fafc;padding:14px;border-radius:8px;border:1px solid var(--border);max-height:260px;overflow-y:auto;}
.rankRow{display:flex;align-items:center;gap:14px;padding:14px 6px;border-bottom:1px solid var(--border);}
.rankRow:last-child{border-bottom:none;}
.rankPos{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex-shrink:0;}
.rankRow.gold .rankPos{background:#e8ac07;}
.rankRow.silver .rankPos{background:#9aa5b1;}
.rankRow.bronze .rankPos{background:#b5651d;}
.rankInfo{flex:1;}
.rankInfo b{color:var(--navy);}
.rankStats{display:flex;gap:22px;font-size:12.5px;color:var(--muted);}
.rankStats b{color:var(--text);font-size:14px;display:block;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;z-index:100;box-shadow:0 8px 22px rgba(0,0,0,.3);display:none;}
</style>
</head>

function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// cada uma dessas vira uma coleção no Firestore, com um documento por registro
const LIST_KEYS = ['clientes','propostas','oportunidades','agenda','despesas','simulacoes','ponto'];

async function loadAll(){
  if(!firebaseOk){ toast('⚠️ Não foi possível conectar ao banco de dados. Verifique sua internet e recarregue a página.'); return; }
  for(const k of LIST_KEYS){
    try{
      const snap = await db.collection(k).get();
      DB[k] = snap.docs.map(d=>d.data());
    }catch(e){ console.error('load error', k, e); }
  }
  try{
    const cfgDoc = await db.collection('config').doc('main').get();
    if(cfgDoc.exists) DB.config = cfgDoc.data();
  }catch(e){ console.error('load config error', e); }
  if(!DB.config || typeof DB.config!=='object'){ DB.config = {agilizaPct:80,vendedoraPct:20}; }
  setupRealtimeListeners();
}
function setupRealtimeListeners(){
  if(!firebaseOk) return;
  LIST_KEYS.forEach(k=>{
    db.collection(k).onSnapshot(snap=>{
      const novo = snap.docs.map(d=>d.data());
      if(JSON.stringify(novo)===JSON.stringify(DB[k])) return; // nada mudou (eco da própria escrita)
      DB[k] = novo;
      if(currentUser && document.getElementById('overlay').style.display!=='flex'){
        goTab(activeTab);
      }
    }, err=>console.error('listener error', k, err));
  });
  db.collection('config').doc('main').onSnapshot(doc=>{
    if(!doc.exists) return;
    const novo = doc.data();
    if(JSON.stringify(novo)===JSON.stringify(DB.config)) return;
    DB.config = novo;
    if(currentUser && document.getElementById('overlay').style.display!=='flex'){
      goTab(activeTab);
    }
  }, err=>console.error('listener error config', err));
}
// grava/atualiza UM registro (documento) dentro de uma coleção
async function saveRecord(coll, record, attempt){
  attempt = attempt||1;
  if(!firebaseOk){ toast('⚠️ Sem conexão com o banco de dados.'); return false; }
  try{
    await db.collection(coll).doc(record.id).set(record);
    return true;
  }catch(e){
    console.error('save error', coll, e);
    if(attempt < 3){ await new Promise(r=>setTimeout(r, 500*attempt)); return saveRecord(coll, record, attempt+1); }
    toast('⚠️ Não foi possível salvar agora (instabilidade no servidor). Tente novamente em instantes.');
    return false;
  }
}
// exclui UM registro (documento) de uma coleção
async function removeRecord(coll, id, attempt){
  attempt = attempt||1;
  if(!firebaseOk){ toast('⚠️ Sem conexão com o banco de dados.'); return false; }
  try{
    await db.collection(coll).doc(id).delete();
    return true;
  }catch(e){
    console.error('delete error', coll, e);
    if(attempt < 3){ await new Promise(r=>setTimeout(r, 500*attempt)); return removeRecord(coll, id, attempt+1); }
    toast('⚠️ Não foi possível excluir agora (instabilidade no servidor). Tente novamente em instantes.');
    return false;
  }
}
// grava vários registros de uma vez (usado na importação de base de oportunidades)
async function saveRecordsBatch(coll, records, attempt){
  attempt = attempt||1;
  if(!firebaseOk){ toast('⚠️ Sem conexão com o banco de dados.'); return false; }
  try{
    const batch = db.batch();
    records.forEach(r=> batch.set(db.collection(coll).doc(r.id), r));
    await batch.commit();
    return true;
  }catch(e){
    console.error('batch save error', coll, e);
    if(attempt < 3){ await new Promise(r=>setTimeout(r, 500*attempt)); return saveRecordsBatch(coll, records, attempt+1); }
    toast('⚠️ Não foi possível importar agora (instabilidade no servidor). Tente novamente em instantes.');
    return false;
  }
}
async function saveConfigDoc(configObj, attempt){
  attempt = attempt||1;
  if(!firebaseOk){ toast('⚠️ Sem conexão com o banco de dados.'); return false; }
  try{
    await db.collection('config').doc('main').set(configObj);
    return true;
  }catch(e){
    console.error('save config error', e);
    if(attempt < 3){ await new Promise(r=>setTimeout(r, 500*attempt)); return saveConfigDoc(configObj, attempt+1); }
    toast('⚠️ Não foi possível salvar agora (instabilidade no servidor). Tente novamente em instantes.');
    return false;
  }
}

  const errEl = document.getElementById('loginErr');
  if(!key){ errEl.textContent='Selecione um usuário.'; return; }

  if(!u || u.senha !== pass){ errEl.textContent='Senha incorreta.'; return; }

function buildNav(){
  const tabs = [
    ['dashboard','Dashboard'],
    ['clientes','Clientes'],
    ['propostas','Propostas'],
    ['oportunidades','Oportunidades'],
    ['ranking','Ranking'],
    ['agenda','Agenda'],

  const nav = document.getElementById('tabsNav');
  nav.innerHTML = tabs.map(([k,l])=>`<button id="tabbtn-${k}" onclick="goTab('${k}')">${l}</button>`).join('');
}
function goTab(tab){
  activeTab = tab;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('tabbtn-'+tab); if(btn) btn.classList.add('active');
  const renderers = {
    dashboard: renderDashboard, clientes: renderClientes, propostas: renderPropostas,
    oportunidades: renderOportunidades, ranking: renderRanking, agenda: renderAgenda,
    simulador: renderSimulador, financeiro: renderFinanceiro, gestor: renderGestor, ponto: renderPonto
  };
  (renderers[tab]||renderDashboard)();
}

let dashMesFiltro = todayISO().slice(0,7);
function renderDashboard(){
  const todasPropostas = currentUser.role==='gestora' ? DB.propostas : DB.propostas.filter(p=>vendedoraDe(p)===currentUser.nome);
  const meses = [...new Set(DB.propostas.filter(p=>p.dataVenda).map(p=>p.dataVenda.slice(0,7)))].sort().reverse();
  const nomesMeses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const fmtMes = ym => { const [y,m] = ym.split('-'); return `${nomesMeses[Number(m)-1]}/${y}`; };

  const mine = dashMesFiltro ? todasPropostas.filter(p=>p.dataVenda && p.dataVenda.slice(0,7)===dashMesFiltro) : todasPropostas;
  const comissaoReceberMinha = mine.filter(p=>!p.comissaoPaga && p.status==='Integrada').reduce((s,p)=>s+Number(p.comissaoVendedora||0),0);
  const totalClientes = currentUser.role==='gestora' ? DB.clientes.length : DB.clientes.filter(c=>c.cadastradoPor===currentUser.nome).length;
  const oportAbertas = DB.oportunidades.filter(o=>o.status==='Novo'||o.status==='Em contato').length;

  const filtroSelect = `<select id="dashMesSelect" onchange="dashMesFiltro=this.value;renderDashboard()" style="width:auto;min-width:170px;">
    <option value="">Todos os meses</option>
    ${meses.map(m=>`<option value="${m}" ${dashMesFiltro===m?'selected':''}>${fmtMes(m)}</option>`).join('')}
  </select>`;

  const valorTotalMine = mine.reduce((s,p)=>s+Number(p.valor||0),0);
  let kpis = `
    <div class="kpis">
      <div class="kpi"><div class="lbl">Clientes cadastrados</div><div class="val">${totalClientes}</div></div>
      <div class="kpi orange"><div class="lbl">Total de propostas (nº)</div><div class="val">${mine.length}</div></div>
      <div class="kpi orange"><div class="lbl">Total de propostas (R$)</div><div class="val">${brl(valorTotalMine)}</div></div>
      <div class="kpi"><div class="lbl">Oportunidades em aberto</div><div class="val">${oportAbertas}</div></div>
    </div>`;

  const recentes = [...mine].sort((a,b)=>(b.dataVenda||'').localeCompare(a.dataVenda||'')).slice(0,6);
  let tbl = recentes.length ? `
    <div class="tableWrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Convênio</th><th>Valor</th><th>Status</th></tr></thead><tbody>
    ${recentes.map(p=>`<tr><td>${fmtDate(p.dataVenda)}</td><td>${esc(p.clienteNome)}</td><td>${esc(p.convenio)}</td><td>${brl(p.valor)}</td><td>${statusPill(p.status)}</td></tr>`).join('')}
    </tbody></table></div>` : `<div class="empty">Nenhuma proposta cadastrada ainda.</div>`;

  const porStatus = STATUS_PROPOSTA.map(s=>{
    const doStatus = mine.filter(p=>p.status===s);
    return {status:s, qtd: doStatus.length, valor: doStatus.reduce((sum,p)=>sum+Number(p.valor||0),0)};
  });
  const statusCards = `
    <div class="kpis">
      ${porStatus.map(({status,qtd,valor})=>`
        <div class="kpi" style="cursor:pointer;" onclick="goTab('propostas');setTimeout(()=>{document.getElementById('propStatusFilter').value='${status}';renderPropostasTable();},0)">
          <div class="lbl">${statusPill(status)}</div>
          <div class="val">${qtd}</div>
          <div style="font-size:14.5px;font-weight:700;color:var(--navy);margin-top:6px;">${brl(valor)}</div>
        </div>
      `).join('')}
    </div>`;

  const fechadas = mine.filter(p=>p.status==='Integrada');
  const porOrigem = ORIGENS.map(o=>({origem:o, qtd: fechadas.filter(p=>(p.clienteOrigem||'')===o).length})).filter(x=>x.qtd>0);
  const semOrigem = fechadas.filter(p=>!p.clienteOrigem).length;
  const origemCards = (porOrigem.length || semOrigem) ? `
    <div class="kpis">
      ${porOrigem.map(({origem,qtd})=>`<div class="kpi"><div class="lbl">${esc(origem)}</div><div class="val">${qtd}</div></div>`).join('')}
      ${semOrigem?`<div class="kpi"><div class="lbl">Sem origem definida</div><div class="val">${semOrigem}</div></div>`:''}
    </div>` : `<div class="empty">Nenhuma proposta integrada ainda.</div>`;

  document.getElementById('mainArea').innerHTML = `
    <div class="pageHead"><h2>Dashboard <span class="muted" style="font-weight:600;font-size:15px;">— ${dashMesFiltro ? fmtMes(dashMesFiltro) : 'Todos os meses'}</span></h2>${filtroSelect}</div>
    ${kpis}
    <div class="card"><h3>Propostas por status${dashMesFiltro?' — '+fmtMes(dashMesFiltro):''}</h3>${statusCards}</div>
    <div class="card"><h3>Propostas fechadas por origem</h3>${origemCards}</div>
    <div class="card"><h3>Propostas recentes</h3>${tbl}</div>
  `;
}

function statusPill(s){
  const map = {'Em digitação':'digitacao','Ag. desbloqueio':'desbloqueio','Em análise':'analise','Integrada':'integrada','Recusada':'recusada','Cancelada':'cancelada','Ag. saldo devedor':'saldo'};
  return `<span class="pill ${map[s]||''}">${esc(s)}</span>`;
}

function getClientesFiltrados(){
  const isGestora = currentUser.role==='gestora';
  const term = (document.getElementById('clienteSearch')?.value||'').toLowerCase();
  let list = [...DB.clientes].sort((a,b)=>(b.dataCadastro||'').localeCompare(a.dataCadastro||''));
  if(!isGestora) list = list.filter(c=>c.cadastradoPor===currentUser.nome);
  if(term) list = list.filter(c => (c.nome||'').toLowerCase().includes(term) || (c.cpf||'').includes(term) || (c.telefone||'').includes(term));
  return list;
}

function downloadCSV(filename, headers, rows){
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v==null?'':v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportarClientesCSV(){
  const list = getClientesFiltrados();
  if(!list.length){ toast('Nenhum cliente para exportar.'); return; }
  const headers = ['Nome','CPF','Nascimento','Telefone','Convênio','UF','Origem','Cadastrado por','Data de cadastro'];
  const rows = list.map(c=>[c.nome, c.cpf, fmtDate(c.nascimento), c.telefone, c.convenio, c.uf||'', c.origem||'', c.cadastradoPor, fmtDate(c.dataCadastro)]);
  downloadCSV('clientes_'+todayISO()+'.csv', headers, rows);
}

  const conv = document.getElementById('f_conv').value;
  document.getElementById('f_ufWrap').style.display = (conv==='GOV'||conv==='PREFEITURA') ? 'block' : 'none';
}
async function saveCliente(id){
  const nome = document.getElementById('f_nome').value.trim();
  const cpf = document.getElementById('f_cpf').value.trim();
  if(!nome || !cpf){ toast('Preencha nome e CPF.'); return; }
  lockSaveBtn();
  const convenio = document.getElementById('f_conv').value;
  const mostraUF = (convenio==='GOV'||convenio==='PREFEITURA');
  const data = {
    nome, cpf,
    nascimento: document.getElementById('f_nasc').value,
    telefone: document.getElementById('f_tel').value.trim(),
    convenio, uf: mostraUF ? document.getElementById('f_uf').value : '',
    origem: document.getElementById('f_origem').value
  };
  let record;
  if(id){
    record = DB.clientes.find(x=>x.id===id);
    Object.assign(record, data);
  } else {
    record = {id:uid(), ...data, cadastradoPor:currentUser.nome, dataCadastro:todayISO()};
    DB.clientes.push(record);
  }
  const ok = await saveRecord('clientes', record);
  if(ok){ closeModal(); toast('Cliente salvo.'); } else { unlockSaveBtn(); }
  renderClientesTable();
}
function deleteCliente(id){
  confirmAction('Excluir este cliente?', async ()=>{
    DB.clientes = DB.clientes.filter(c=>c.id!==id);
    const ok = await removeRecord('clientes', id);
    renderClientesTable();
    toast(ok ? 'Cliente excluído.' : 'Excluído aqui, mas não sincronizou — tente de novo.');
  });
}

      <div style="display:flex;gap:10px;">
        <button class="btn btn-outline" onclick="exportarPropostasCSV()">⬇️ Exportar Excel (CSV)</button>
        <button class="btn btn-orange" onclick="openPropostaForm()">+ Nova Proposta</button>
      </div>
    </div>
    <div class="toolbar">
      <input id="propSearch" placeholder="Buscar por nome ou CPF..." oninput="renderPropostasTable()">
      <select id="propStatusFilter" onchange="renderPropostasTable()"><option value="">Todos os status</option>${STATUS_PROPOSTA.map(s=>`<option>${s}</option>`).join('')}</select>
    </div>
    <div class="card" id="propTableWrap"></div>
  `;
  renderPropostasTable();
}
function getPropostasFiltradas(){
  const isGestora = currentUser.role==='gestora';
  const term = (document.getElementById('propSearch')?.value||'').toLowerCase();
  const statusF = document.getElementById('propStatusFilter')?.value||'';
  let list = [...DB.propostas].sort((a,b)=>(b.dataVenda||'').localeCompare(a.dataVenda||''));
  if(!isGestora) list = list.filter(p=>vendedoraDe(p)===currentUser.nome);
  if(term) list = list.filter(p=>(p.clienteNome||'').toLowerCase().includes(term)||(p.clienteCpf||'').includes(term));
  if(statusF) list = list.filter(p=>p.status===statusF);
  return list;
}
function renderPropostasTable(){
  const isGestora = currentUser.role==='gestora';
  const list = getPropostasFiltradas();
  const wrap = document.getElementById('propTableWrap');
  if(!list.length){ wrap.innerHTML = `<div class="empty">Nenhuma proposta encontrada.</div>`; return; }
  wrap.innerHTML = `<div class="tableWrap"><table><thead><tr>
    <th>Data</th><th>Cliente</th><th>Convênio</th><th>Origem</th><th>Banco</th><th>Promotora</th><th>Modalidade</th><th>Valor</th><th>Parcela</th><th>Prazo</th><th>Status</th>${isGestora?'<th>Vendedora</th>':''}<th>Ações</th>
  </tr></thead><tbody>
  ${list.map(p=>`<tr>
    <td>${fmtDate(p.dataVenda)}</td><td><b>${esc(p.clienteNome)}</b><br><span class="muted">${esc(p.clienteCpf)}</span></td>
    <td>${esc(p.convenio)}</td><td>${esc(p.clienteOrigem||'-')}</td><td>${esc(p.banco)}</td><td>${esc(p.promotora)}</td><td>${esc(p.modalidade)}</td>
    <td>${brl(p.valor)}</td><td>${brl(p.parcela)}</td><td>${esc(p.prazo)}x</td>
    <td>${statusPill(p.status)}</td>${isGestora?`<td>${esc(vendedoraDe(p))}</td>`:''}
    <td>
      ${canEditProposta(p) ? `<button class="iconbtn" title="Editar" onclick="openPropostaForm('${p.id}')">✏️</button>` : ''}
      ${currentUser.role==='gestora' ? `<button class="iconbtn" title="Excluir" onclick="deleteProposta('${p.id}')">🗑️</button>` : ''}
    </td>
  </tr>`).join('')}
  </tbody></table></div>`;
}
function exportarPropostasCSV(){
  const list = getPropostasFiltradas();
  if(!list.length){ toast('Nenhuma proposta para exportar.'); return; }
  const headers = ['Data da venda','Cliente','CPF','Convênio','Origem','Banco','Promotora','Modalidade','Valor','Parcela','Prazo','Status','% Comissão','Comissão Total','Comissão Agiliza','Comissão Vendedora','Vendedora','Cadastrado por','Comissão paga'];
  const rows = list.map(p=>[
    fmtDate(p.dataVenda), p.clienteNome, p.clienteCpf, p.convenio, p.clienteOrigem||'', p.banco, p.promotora, p.modalidade,
    (p.valor||0).toFixed(2).replace('.',','), (p.parcela||0).toFixed(2).replace('.',','), p.prazo,
    p.status, p.comissaoPct, (p.comissaoTotal||0).toFixed(2).replace('.',','), (p.comissaoAgiliza||0).toFixed(2).replace('.',','),
    (p.comissaoVendedora||0).toFixed(2).replace('.',','), vendedoraDe(p), p.cadastradoPor, p.comissaoPaga?'Sim':'Não'
  ]);
  downloadCSV('propostas_'+todayISO()+'.csv', headers, rows);
}

          <div class="field"><label>Valor refin liberado — líquido (R$)</label><input type="number" step="0.01" id="pf_valorRefinLiq" value="${p?p.valorRefinLiq||'':''}" oninput="atualizarValorPortRefin()"></div>
          <div class="field"><label>Como esse banco remunera?</label><select id="pf_remuneracao" onchange="toggleRemuneracao()">

function toggleModalidadeExtras(){
  const modal = document.getElementById('pf_modal').value;
  const isPR = modal === 'Portabilidade + Refin';
  document.getElementById('pf_portRefinWrap').style.display = isPR ? 'block' : 'none';
  document.getElementById('pf_valor').readOnly = isPR;
  document.getElementById('pf_valor').style.background = isPR ? '#f8fafc' : '#fff';
  if(isPR){
    atualizarValorPortRefin();
    toggleRemuneracao();
  } else {
    document.getElementById('pf_genericComissaoWrap').style.display = 'grid';
    document.getElementById('pf_liquidoWrap').style.display = 'none';
    calcComissaoPreview();
  }
}
function atualizarValorPortRefin(){
  const saldo = Number(document.getElementById('pf_saldoDevedor')?.value)||0;
  const refin = Number(document.getElementById('pf_valorRefinLiq')?.value)||0;
  document.getElementById('pf_valor').value = (saldo+refin).toFixed(2);
  calcComissaoPreview();
}
function toggleRemuneracao(){
  const modal = document.getElementById('pf_modal')?.value;
  if(modal !== 'Portabilidade + Refin') return;
  const isLiquido = document.getElementById('pf_remuneracao').value === 'liquido';
  document.getElementById('pf_liquidoWrap').style.display = isLiquido ? 'grid' : 'none';
  document.getElementById('pf_genericComissaoWrap').style.display = isLiquido ? 'none' : 'grid';
  calcComissaoPreview();
}
function findClienteAcessivel(cpf){
  const c = DB.clientes.find(x=>x.cpf===cpf);
  if(!c) return null;
  if(currentUser.role!=='gestora' && c.cadastradoPor!==currentUser.nome) return null;
  return c;
}
function autofillClienteProposta(){
  const cpf = document.getElementById('pf_cpf').value.trim();
  const c = findClienteAcessivel(cpf);
  const info = document.getElementById('pf_clienteInfo');
  if(c){ info.innerHTML = `<b>${esc(c.nome)}</b> · ${esc(c.telefone)} · ${esc(c.convenio)}${c.uf?` (${esc(c.uf)})`:''}`; }
  else { info.innerHTML = `<span style="color:var(--red)">Cliente não encontrado — cadastre-o primeiro em Clientes.</span>`; }
}
function calcComissaoTotalAtual(){
  const manual = Number(document.getElementById('pf_comTotalManual')?.value)||0;
  if(manual>0) return manual;
  const modal = document.getElementById('pf_modal')?.value;
  if(modal === 'Portabilidade + Refin' && document.getElementById('pf_remuneracao')?.value === 'liquido'){
    const saldo = Number(document.getElementById('pf_saldoDevedor')?.value)||0;
    const refin = Number(document.getElementById('pf_valorRefinLiq')?.value)||0;
    const pctPort = Number(document.getElementById('pf_pctPort')?.value)||0;
    const pctRefin = Number(document.getElementById('pf_pctRefin')?.value)||0;
    return (saldo*pctPort/100) + (refin*pctRefin/100);
  }
  const valor = Number(document.getElementById('pf_valor')?.value)||0;
  const pct = Number(document.getElementById('pf_pct')?.value)||0;
  return valor*pct/100;
}
function calcComissaoPreview(){
  const total = calcComissaoTotalAtual();
  const agiliza = total * DB.config.agilizaPct/100;
  const vend = total * DB.config.vendedoraPct/100;
  document.getElementById('pf_comTotal').textContent = brl(total);
  document.getElementById('pf_comAgiliza').textContent = brl(agiliza);
  document.getElementById('pf_comVend').textContent = brl(vend);
}
async function saveProposta(id){
  const cpf = document.getElementById('pf_cpf').value.trim();
  const cliente = findClienteAcessivel(cpf);
  if(!cliente){ toast('Selecione um cliente válido (cadastrado por você).'); return; }
  const modalidade = document.getElementById('pf_modal').value;
  const isPR = modalidade === 'Portabilidade + Refin';
  const valor = Number(document.getElementById('pf_valor').value)||0;
  const pct = Number(document.getElementById('pf_pct').value)||0;
  const comTotalManual = Number(document.getElementById('pf_comTotalManual')?.value)||0;
  const remuneracao = isPR ? document.getElementById('pf_remuneracao').value : '';
  const pctPort = isPR ? Number(document.getElementById('pf_pctPort')?.value)||0 : 0;
  const pctRefin = isPR ? Number(document.getElementById('pf_pctRefin')?.value)||0 : 0;
  const comissaoTotal = calcComissaoTotalAtual();
  if(!comissaoTotal){ toast('Informe o % de comissão (ou os % de portabilidade/refin) OU o valor total em R$.'); return; }
  lockSaveBtn();
  const comissaoPctFinal = comTotalManual>0 && valor>0 ? (comissaoTotal/valor*100) : (isPR && remuneracao==='liquido' ? '' : pct);
  const comissaoAgiliza = comissaoTotal*DB.config.agilizaPct/100;
  const comissaoVendedora = comissaoTotal*DB.config.vendedoraPct/100;
  const isGestora = currentUser.role==='gestora';
  const vendedora = isGestora ? document.getElementById('pf_vendedora').value : currentUser.nome;
  const data = {
    dataVenda: document.getElementById('pf_data').value,
    clienteCpf: cpf, clienteNome: cliente.nome, clienteTelefone: cliente.telefone, convenio: cliente.convenio, clienteOrigem: cliente.origem||'',
    banco: document.getElementById('pf_banco').value.trim(),
    promotora: document.getElementById('pf_promotora').value,
    modalidade,
    valor, parcela: Number(document.getElementById('pf_parcela').value)||0, prazo: Number(document.getElementById('pf_prazo').value)||0,
    status: document.getElementById('pf_status').value,
    comissaoPct: comissaoPctFinal, comissaoTotalManual: comTotalManual>0, comissaoTotal, comissaoAgiliza, comissaoVendedora,
    vendedora,
    saldoDevedor: isPR ? (Number(document.getElementById('pf_saldoDevedor').value)||0) : null,
    valorRefinLiq: isPR ? (Number(document.getElementById('pf_valorRefinLiq').value)||0) : null,
    remuneracao: isPR ? remuneracao : '',
    pctPort: isPR ? pctPort : null,
    pctRefin: isPR ? pctRefin : null
  };
  let record;
  if(id){
    record = DB.propostas.find(x=>x.id===id);
    Object.assign(record, data);
  } else {
    record = {id:uid(), ...data, cadastradoPor:currentUser.nome, comissaoPaga:false, dataPagamento:null};
    DB.propostas.push(record);
  }
  const ok = await saveRecord('propostas', record);
  if(ok){ closeModal(); toast('Proposta salva.'); } else { unlockSaveBtn(); }
  renderPropostasTable();
}
function deleteProposta(id){
  confirmAction('Excluir esta proposta?', async ()=>{
    DB.propostas = DB.propostas.filter(p=>p.id!==id);
    const ok = await removeRecord('propostas', id);
    renderPropostasTable();
    toast(ok ? 'Proposta excluída.' : 'Excluída aqui, mas não sincronizou — tente de novo.');
  });
}

    <td style="font-size:12px;">${[o.tel1,o.tel2,o.tel3].filter(Boolean).map(esc).join('<br>')||'-'}</td>
    <td>${(o.responsavel===currentUser.nome || isGestora)
        ? `<input type="text" value="${esc(o.telefoneHigienizado||'')}" placeholder="Digitar..." style="min-width:130px;padding:6px 8px;font-size:12.5px;" onchange="updateTelHigienizado('${o.id}', this.value)">`

      ${isGestora ? `<button class="iconbtn" title="Excluir" onclick="deleteOport('${o.id}')">🗑️</button>` : ''}
    </td>
  </tr>`).join('')}
  </tbody></table></div>`;
}
function oportPill(s){
  const map={'Ag. Atendimento':'digitacao','Atendido':'analise','Sem interesse':'recusada','Sem valores liberados':'recusada','Reagendar contato':'pendente','Convertido':'integrada'};
  return `<span class="pill ${map[s]||''}">${esc(s)}</span>`;
}

  `);
}
function normHeader(h){ return (h||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
const HEADER_MAP = {
  nome:['nome','cliente'], cpf:['cpf'], email:['email'],
  dataNasc:['datanasc','nascimento','datadenascimento'],
  tel1:['tel1'], tel2:['tel2'], tel3:['tel3'],
  telefoneHigienizado:['telnovavida','telefonehigienizado','telhig','telhigienizado'],
  valorRefin:['valorlib','valorliberado','valorrefin','valorrefinliberado','valorrefinliberdo']
};
function parseCSVLine(line, delim){
  // suporta campos simples com ou sem aspas
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ inQ=!inQ; continue; }
    if(ch===delim && !inQ){ out.push(cur.trim()); cur=''; continue; }
    cur+=ch;
  }
  out.push(cur.trim());
  return out;
}
function parseOportBatch(text){
  const lines = text.split(/\r?\n/).map(l=>l).filter(l=>l.trim().length);
  if(!lines.length) return [];
  const firstLine = lines[0];
  const delim = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : (firstLine.includes('\t') ? '\t' : ',');
  const headerCells = parseCSVLine(firstLine, delim).map(normHeader);
  const colIndex = {};
  Object.keys(HEADER_MAP).forEach(field=>{
    const idx = headerCells.findIndex(h => HEADER_MAP[field].includes(h));
    if(idx>-1) colIndex[field]=idx;
  });
  const hasHeader = colIndex.nome!==undefined || colIndex.cpf!==undefined;
  const dataLines = hasHeader ? lines.slice(1) : lines;
  const rows = [];
  for(const line of dataLines){
    const cells = parseCSVLine(line, delim);
    if(!cells[0]) continue;
    let row;
    if(hasHeader){
      const get = f => colIndex[f]!==undefined ? (cells[colIndex[f]]||'').trim() : '';
      row = { nome:get('nome'), cpf:get('cpf'), email:get('email'), dataNasc:get('dataNasc'),
        tel1:get('tel1'), tel2:get('tel2'), tel3:get('tel3'),
        telefoneHigienizado:get('telefoneHigienizado'), valorRefinRaw:get('valorRefin') };
    } else {
      // fallback: nome, cpf, tel1, tel2, tel3, valor lib
      row = { nome:cells[0]||'', cpf:cells[1]||'', email:'', dataNasc:'',
        tel1:cells[2]||'', tel2:cells[3]||'', tel3:cells[4]||'', telefoneHigienizado:'', valorRefinRaw:cells[5]||'' };
    }
    if(!row.nome) continue;
    const valorRefinClean = (row.valorRefinRaw||'').replace(/[^\d,.-]/g,'').replace(',','.');
    row.valorRefin = valorRefinClean ? Number(valorRefinClean)||0 : 0;
    rows.push(row);
  }
  return rows;
}
function handleBaseFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('baseText').value = e.target.result;
    const rows = parseOportBatch(e.target.result);
    document.getElementById('basePreview').textContent = rows.length ? `${rows.length} lead(s) detectado(s) no arquivo.` : 'Não foi possível identificar leads neste arquivo — confira as colunas.';
  };
  reader.readAsText(file, 'UTF-8');
}
async function saveBase(){
  const raw = document.getElementById('baseText').value.trim();
  const resp = document.getElementById('baseResp').value;
  const convenio = document.getElementById('baseConvenio').value;
  if(!raw){ toast('Selecione um arquivo ou cole os dados.'); return; }
  if(!convenio){ toast('Selecione o convênio desta base.'); return; }
  lockSaveBtn();
  const rows = parseOportBatch(raw);
  const novosRegistros = rows.map(r=>({
    id: uid(), nome:r.nome, cpf:r.cpf, email:r.email, dataNasc:r.dataNasc, convenio,
    tel1:r.tel1, tel2:r.tel2, tel3:r.tel3,

  DB.oportunidades.push(...novosRegistros);
  const ok = await saveRecordsBatch('oportunidades', novosRegistros);
  if(ok){ closeModal(); toast(rows.length+' lead(s) importado(s).'); } else { unlockSaveBtn(); }
  renderOportTable();
}

/* ============================= RANKING ============================= */
function renderRanking(){
  const consultoras = Object.values(USERS).filter(u=>u.role==='consultora').map(u=>u.nome);
  const stats = consultoras.map(nome=>{
    const props = DB.propostas.filter(p=>vendedoraDe(p)===nome);
    const emAndamento = props.filter(p=>p.status!=='Recusada' && p.status!=='Cancelada');
    const integradas = props.filter(p=>p.status==='Integrada');
    const totalProducao = emAndamento.reduce((s,p)=>s+Number(p.valor||0),0);
    return {nome, qtdAndamento: emAndamento.length, qtdIntegradas: integradas.length, totalPropostas: props.length, totalProducao};
  }).sort((a,b)=>b.totalProducao-a.totalProducao);

  const medalClass = ['gold','silver','bronze'];
  document.getElementById('mainArea').innerHTML = `
    <div class="pageHead"><h2>Ranking de Vendas</h2></div>
    <p class="muted" style="font-size:12.5px;margin-top:-10px;">Considera todas as propostas em andamento (exceto recusadas e canceladas), não só as já integradas.</p>
    <div class="card">
      ${stats.map((s,i)=>`
        <div class="rankRow ${medalClass[i]||''}">
          <div class="rankPos">${i+1}º</div>
          <div class="rankInfo"><b>${esc(s.nome)}</b><div class="muted" style="font-size:12px;">${s.totalPropostas} proposta(s) no total</div></div>
          <div class="rankStats">
            <div>Em andamento<b>${s.qtdAndamento}</b></div>
            <div>Integradas<b>${s.qtdIntegradas}</b></div>
            <div>Total em produção<b>${brl(s.totalProducao)}</b></div>
          </div>
        </div>
      `).join('') || '<div class="empty">Sem dados ainda.</div>'}
    </div>
  `;
}

    <h3>${a?'Editar Compromisso':'Novo Compromisso'}</h3>

  `);

async function saveAgenda(id){
  lockSaveBtn();
  const data = {
    data: document.getElementById('ag_data').value,
    hora: document.getElementById('ag_hora').value,
    cliente: document.getElementById('ag_cliente').value.trim(),
    tipo: document.getElementById('ag_tipo').value,
    nota: document.getElementById('ag_nota').value.trim()
  };
  let record;
  if(id){ record = DB.agenda.find(x=>x.id===id); Object.assign(record, data); }
  else { record = {id:uid(), ...data, responsavel:currentUser.nome, status:'Pendente'}; DB.agenda.push(record); }
  const ok = await saveRecord('agenda', record);
  if(ok){ closeModal(); toast('Compromisso salvo.'); } else { unlockSaveBtn(); }
  renderAgendaTable();
}
async function concluirAgenda(id){
  const a = DB.agenda.find(x=>x.id===id);
  a.status='Concluído';
  await saveRecord('agenda', a); renderAgendaTable();
}
function deleteAgenda(id){
  confirmAction('Excluir este compromisso?', async ()=>{
    DB.agenda = DB.agenda.filter(a=>a.id!==id);
    const ok = await removeRecord('agenda', id);
    renderAgendaTable();
    toast(ok ? 'Excluído.' : 'Excluído aqui, mas não sincronizou — tente de novo.');
  });
}

function exportarSimulacoesCSV(){
  const isGestora = currentUser.role==='gestora';
  let list = [...DB.simulacoes];
  if(!isGestora) list = list.filter(s=>s.feitaPor===currentUser.nome);
  if(!list.length){ toast('Nenhuma simulação para exportar.'); return; }
  const headers = ['Data/Hora','Cliente','CPF','Telefone','Convênio','Banco','Prazo','Valor liberado','Parcela','Status','Feita por'];
  const rows = list.map(s=>[
    s.dataHora?new Date(s.dataHora).toLocaleString('pt-BR'):'',
    s.nome||'', s.cpf||'', s.telefone||'', s.convenio||'', s.banco||'', s.prazo||'',
    (s.liberado||0).toFixed(2).replace('.',','), (s.parcela||0).toFixed(2).replace('.',','),
    s.status||'Em negociação', s.feitaPor||''
  ]);
  const csv = [headers, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'simulacoes_'+todayISO()+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function salvarSimulacao(){
  const liberado = calcTotalLiberado();

  if(!liberado && !parcela){ toast('Preencha e calcule a simulação antes de salvar.'); return; }
  if(!document.getElementById('msgPronta').value) gerarSimulacao();

function setSimConv(c){ simConv=c; simPortabRows=[]; simRefinRows=[]; renderSimulador(); }
function calcValorLiberado(){
  const parcela = Number(document.getElementById('s_parcela').value)||0;
  const coef = Number(document.getElementById('s_coef').value)||0;
  if(!coef){ toast('Informe o coeficiente.'); return; }
  document.getElementById('s_liberado').value = (parcela/coef).toFixed(2);
  updateSimTotais();
}
function calcParcela(){
  const coef = Number(document.getElementById('s_coef').value)||0;
  const liberado = Number(document.getElementById('s_liberado').value)||0;
  if(!liberado){ toast('Informe o valor liberado ou calcule-o primeiro.'); return; }
  document.getElementById('s_parcela').value = (liberado*coef).toFixed(2);
  updateSimTotais();
}
function calcTotalLiberado(){
  const margemNova = Number(document.getElementById('s_liberado')?.value)||0;
  const portab = simPortabRows.reduce((s,r)=>s+(Number(r.libera)||0),0);
  const refin = simRefinRows.reduce((s,r)=>s+(Number(r.libera)||0),0);
  return margemNova + portab + refin;
}
function gerarSimulacao(){
  const nome=document.getElementById('s_nome').value||'-';
  const cpf=document.getElementById('s_cpf').value||'-';
  const tel=document.getElementById('s_tel').value||'-';
  const beneficio=document.getElementById('s_beneficio').value||'-';
  const parc1=document.getElementById('s_1parc').value||'-';
  const banco=document.getElementById('s_banco').value||'-';
  const prazo=document.getElementById('s_prazo').value||'-';
  const parcela=Number(document.getElementById('s_parcela').value)||0;
  const liberadoMargem=Number(document.getElementById('s_liberado').value)||0;

  const nota = `ℹ️ Essa parcela já é descontada atualmente no benefício do cliente.\nO valor da parcela continua o mesmo e apenas o prazo é estendido.\nPor esse motivo, essa parcela não entra na soma de novas parcelas.`;
  let blocos = [`Margem Nova — Parcela: ${brl(parcela)} que libera ${brl(liberadoMargem)} em ${prazo}x`];
  simPortabRows.forEach(r=>{
    if(r.libera) blocos.push(`Portabilidade + Refinanciamento da parcela ${brl(r.parcelaAtual||0)} que estende para ${r.estendePara||'-'}x libera ${brl(r.libera)}\n${nota}`);
  });
  simRefinRows.forEach(r=>{
    if(r.libera) blocos.push(`Refinanciamento da parcela ${brl(r.parcelaAtual||0)} que estende para ${r.estendePara||'-'}x libera ${brl(r.libera)}\n${nota}`);
  });

  const totalLiberado = calcTotalLiberado();
  const msg = `📱 SIMULAÇÃO — ${simConv}

*Cliente:* ${nome}
CPF: ${cpf}
Telefone: ${tel}
Tipo de Benefício: ${beneficio}
Primeira parcela para: ${parc1}

Banco: ${banco}
${blocos.join('\n\n')}

*TOTAL LIBERADO: ${brl(totalLiberado)}*
*TOTAL DE PARCELA: ${brl(parcela)}*`;
  document.getElementById('msgPronta').value = msg;
  document.getElementById('simMsgCard').style.display='block';
}
function copiarTexto(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>toast('Mensagem copiada!')).catch(()=>copiarTextoFallback(text));
  } else {
    copiarTextoFallback(text);
  }
}
function copiarTextoFallback(text){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    toast(ok ? 'Mensagem copiada!' : 'Não deu pra copiar automaticamente — toque no campo da mensagem, selecione tudo e copie manualmente.');
  }catch(e){
    toast('Não deu pra copiar automaticamente — toque no campo da mensagem, selecione tudo e copie manualmente.');
  }
}
function copiarWhatsapp(){
  const el = document.getElementById('msgPronta');
  if(!el || !el.value){ gerarSimulacao(); }
  const text = document.getElementById('msgPronta').value;
  copiarTexto(text);
}

      </button>
    </div>
    <div class="toolbar">
      ${isGestora ? `<select id="ptRespFilter" onchange="renderPontoTable()"><option value="">Todas as usuárias</option>${Object.values(USERS).map(u=>`<option>${u.nome}</option>`).join('')}</select>` : ''}
      <input type="date" id="ptDataFilter" onchange="renderPontoTable()">
    </div>
    <div class="card" id="ptTableWrap"></div>
  `;
  renderPontoTable();
}
function renderPontoTable(){
  const isGestora = currentUser.role==='gestora';
  const respF = document.getElementById('ptRespFilter')?.value||'';
  const dataF = document.getElementById('ptDataFilter')?.value||'';
  let list = [...DB.ponto].sort((a,b)=>b.dataHora.localeCompare(a.dataHora));
  if(!isGestora) list = list.filter(p=>p.usuario===currentUser.nome);
  else if(respF) list = list.filter(p=>p.usuario===respF);
  if(dataF) list = list.filter(p=>p.dataHora.slice(0,10)===dataF);
  const wrap = document.getElementById('ptTableWrap');
  if(!list.length){ wrap.innerHTML = `<div class="empty">Nenhum registro de ponto encontrado.</div>`; return; }
  wrap.innerHTML = `<div class="tableWrap"><table><thead><tr><th>Usuária</th><th>Data</th><th>Hora</th><th>Tipo</th></tr></thead><tbody>
  ${list.map(p=>{
    const d = new Date(p.dataHora);
    return `<tr><td>${esc(p.usuario)}</td><td>${d.toLocaleDateString('pt-BR')}</td><td>${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</td>
    <td><span class="pill ${p.tipo==='Entrada'?'integrada':'recusada'}">${p.tipo}</span></td></tr>`;
  }).join('')}
  </tbody></table></div>`;
}
async function registrarPonto(tipo){
  const record = {id:uid(), usuario:currentUser.nome, tipo, dataHora:new Date().toISOString()};
  DB.ponto.push(record);
  await saveRecord('ponto', record);
  toast(tipo+' registrada às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.');
  renderPonto();
}

/* ============================= INIT ============================= */
(async function init(){
  await loadAll();
})();
</script>
</body>
